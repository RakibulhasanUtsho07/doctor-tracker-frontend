name: Accessibility browser acceptance

on:
  pull_request:
    branches: [rakibul-hasan, dev, main, 'feat/**']
  push:
    branches: [rakibul-hasan, dev, main, 'feat/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: accessibility-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  accessibility-browser:
    name: WCAG, keyboard and reduced-motion checks (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned Playwright and axe runner
        run: npm install --prefix .e2e-tools --no-save --package-lock=false @playwright/test@1.64.1 @axe-core/playwright@4.14.0

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-1.64.1

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: ./.e2e-tools/node_modules/.bin/playwright install chromium

      - name: Run accessibility browser suite
        run: ./.e2e-tools/node_modules/.bin/playwright test --config=e2e/accessibility.config.mjs
        env:
          CI: "true"

      - name: Upload axe reports, screenshots and Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-tracker-accessibility-e2e
          path: |
            test-results/
            accessibility-report/
          if-no-files-found: warn
          retention-days: 14
