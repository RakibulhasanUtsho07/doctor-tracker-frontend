name: Shell browser acceptance

on:
  pull_request:
    branches: [rakibul-hasan, dev, main, 'feat/**']
  push:
    branches: [rakibul-hasan, dev, main, 'feat/**']

permissions:
  contents: read

concurrency:
  group: shell-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell-browser:
    name: Responsive shell, navigation and motion (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/setup@v3.1.2
        with:
          version: 11.21.0
          install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned isolated Playwright runner
        run: npm install --prefix .e2e-tools --no-save --package-lock=false @playwright/test@1.64.1

      - name: Cache Playwright Chromium
        uses: actions/cache@v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-1.64.1

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: ./.e2e-tools/node_modules/.bin/playwright install chromium

      - name: Run responsive shell acceptance
        run: ./.e2e-tools/node_modules/.bin/playwright test --config=e2e/shell-acceptance.config.mjs
        env:
          CI: "true"

      - name: Upload synthetic shell screenshots and Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: doctor-tracker-shell-acceptance
          path: |
            test-results/
            shell-acceptance-report/
          if-no-files-found: warn
          retention-days: 14
