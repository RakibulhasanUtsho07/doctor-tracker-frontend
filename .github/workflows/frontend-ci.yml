name: Frontend CI

on:
  pull_request:
    branches: [rakibul-hasan, dev, main, 'feat/**']
  push:
    branches: [rakibul-hasan, dev, main]

permissions:
  contents: read

jobs:
  validate:
    name: Lint and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: API client unit tests
        run: pnpm test
      - name: Source lint
        run: pnpm lint
      - name: Production build (includes TypeScript checks)
        run: pnpm build
