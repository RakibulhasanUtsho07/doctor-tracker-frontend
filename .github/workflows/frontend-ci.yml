name: Frontend CI

on:
  pull_request:
    branches: [rakibul-hasan, dev, main, 'feat/**']
  push:
    branches: [rakibul-hasan, dev, main, 'feat/**']

permissions:
  contents: read

jobs:
  validate:
    name: Lint and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          version: 11.21.0
          install: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Unit tests and staging-smoke syntax
        run: |
          pnpm test
          node --check scripts/staging-smoke-guard.mjs
          node --check e2e/staging-smoke.config.mjs
          node --check e2e/staging-smoke.spec.mjs
      - name: Source lint
        run: pnpm lint
      - name: Production build (includes TypeScript checks)
        run: pnpm build
