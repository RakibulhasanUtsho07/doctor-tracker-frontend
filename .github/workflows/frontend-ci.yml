name: Frontend CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [rakibul-hasan, dev, main]

permissions:
  contents: read

jobs:
  validate:
    name: Lint and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup pnpm
        uses: pnpm/setup@v3.1.2
        with:
          version: 11.21.0
          install: false
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Source lint
        run: pnpm lint
      - name: Production build (includes TypeScript checks)
        run: pnpm build
