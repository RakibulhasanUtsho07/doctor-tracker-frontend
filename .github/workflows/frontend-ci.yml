name: Frontend CI

on:
  pull_request:
    branches: [rakibul-hasan, dev, main, 'feat/**']
  push:
    branches: [rakibul-hasan, dev, main, 'feat/**']

permissions:
  contents: read

jobs:
  validate:
    name: Lint and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup pnpm
        uses: pnpm/setup@v3.1.2
        with:
          version: 11.21.0
          install: false
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Unit tests and staging-smoke syntax
        run: |
          pnpm test
          node --check scripts/staging-smoke-guard.mjs
          node --check e2e/staging-smoke.config.mjs
          node --check e2e/staging-smoke.spec.mjs
      - name: Source lint
        run: pnpm lint
      - name: Production build (includes TypeScript checks)
        run: pnpm build
      - name: Checkout pre-nonce cached/PPR comparison candidate
        if: github.ref == 'refs/heads/feat/performance-baseline' || github.event.pull_request.head.ref == 'feat/performance-baseline'
        uses: actions/checkout@v7.0.1
        with:
          ref: 9356a765ddcad60baf4964bb8b1db968b40a5184
          path: ppr-baseline
          persist-credentials: false
      - name: Install comparison candidate dependencies
        if: github.ref == 'refs/heads/feat/performance-baseline' || github.event.pull_request.head.ref == 'feat/performance-baseline'
        working-directory: ppr-baseline
        run: pnpm install --frozen-lockfile
      - name: Build pre-nonce cached/PPR comparison candidate
        if: github.ref == 'refs/heads/feat/performance-baseline' || github.event.pull_request.head.ref == 'feat/performance-baseline'
        working-directory: ppr-baseline
        env:
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:4000/api/v1
        run: pnpm build
      - name: Start pre-nonce cached/PPR candidate
        if: github.ref == 'refs/heads/feat/performance-baseline' || github.event.pull_request.head.ref == 'feat/performance-baseline'
        working-directory: ppr-baseline
        run: |
          pnpm start --hostname 127.0.0.1 --port 3100 > /tmp/doctor-tracker-ppr-start.log 2>&1 &
          echo $! > /tmp/doctor-tracker-ppr.pid
          for attempt in $(seq 1 30); do
            if curl --silent --fail --output /dev/null http://127.0.0.1:3100/; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/doctor-tracker-ppr-start.log
          exit 1
      - name: Start nonce-CSP candidate
        if: github.ref == 'refs/heads/feat/performance-baseline' || github.event.pull_request.head.ref == 'feat/performance-baseline'
        run: |
          pnpm start --hostname 127.0.0.1 --port 3101 > /tmp/doctor-tracker-nonce-start.log 2>&1 &
          echo $! > /tmp/doctor-tracker-nonce.pid
          for attempt in $(seq 1 30); do
            if curl --silent --fail --output /dev/null http://127.0.0.1:3101/; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/doctor-tracker-nonce-start.log
          exit 1
      - name: Measure pre-nonce cached/PPR candidate
        if: github.ref == 'refs/heads/feat/performance-baseline' || github.event.pull_request.head.ref == 'feat/performance-baseline'
        env:
          PERF_BASE_URL: http://127.0.0.1:3100/
          PERF_LABEL: pre-nonce cached/PPR baseline at 9356a765
          PERF_RUNS: "30"
          PERF_WARMUP_RUNS: "3"
          PERF_TIMEOUT_MS: "5000"
        run: node scripts/performance-baseline.mjs | tee performance-baseline-ppr.json
      - name: Measure per-response nonce-CSP candidate
        if: github.ref == 'refs/heads/feat/performance-baseline' || github.event.pull_request.head.ref == 'feat/performance-baseline'
        env:
          PERF_BASE_URL: http://127.0.0.1:3101/
          PERF_LABEL: per-response nonce-CSP dynamic candidate
          PERF_RUNS: "30"
          PERF_WARMUP_RUNS: "3"
          PERF_TIMEOUT_MS: "5000"
        run: node scripts/performance-baseline.mjs | tee performance-baseline-nonce.json
      - name: Compare observational performance reports
        if: github.ref == 'refs/heads/feat/performance-baseline' || github.event.pull_request.head.ref == 'feat/performance-baseline'
        run: node scripts/compare-performance-baselines.mjs | tee performance-comparison.json
      - name: Upload comparative observational performance reports
        if: always() && (github.ref == 'refs/heads/feat/performance-baseline' || github.event.pull_request.head.ref == 'feat/performance-baseline')
        uses: actions/upload-artifact@v7.0.2
        with:
          name: frontend-performance-baseline-comparison
          path: |
            performance-baseline-ppr.json
            performance-baseline-nonce.json
            performance-comparison.json
          if-no-files-found: warn
          retention-days: 14
      - name: Stop benchmark servers
        if: always() && (github.ref == 'refs/heads/feat/performance-baseline' || github.event.pull_request.head.ref == 'feat/performance-baseline')
        run: |
          for pid_file in /tmp/doctor-tracker-ppr.pid /tmp/doctor-tracker-nonce.pid; do
            if [ -f "$pid_file" ]; then
              kill "$(cat "$pid_file")" 2>/dev/null || true
            fi
          done
