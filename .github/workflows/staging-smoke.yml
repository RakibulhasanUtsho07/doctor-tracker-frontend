name: Staging browser smoke

on:
  workflow_dispatch:
    inputs:
      frontend_url:
        description: Public staging frontend HTTPS URL; hostname must exactly match the trusted STAGING_FRONTEND_HOST repository variable
        required: true
        type: string
      api_base_url:
        description: Public staging API HTTPS base URL ending in /api/v1; hostname must exactly match the trusted STAGING_API_HOST repository variable
        required: true
        type: string
      doctor_id:
        description: Existing synthetic doctor fixture ID (24 hexadecimal characters) in the disposable staging database
        required: true
        type: string
      confirmation:
        description: Type I_CONFIRM_DISPOSABLE_STAGING only after confirming the target is disposable staging
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: staging-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  staging-smoke:
    # Do not expose staging credentials from feature/unreviewed refs.
    if: github.ref == 'refs/heads/dev'
    name: Deployed HTTPS browser smoke (mutating staging data)
    environment:
      name: disposable-staging
          runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout selected candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Reject unsafe targets before network access
        env:
          FRONTEND_URL: ${{ inputs.frontend_url }}
          API_BASE_URL: ${{ inputs.api_base_url }}
          STAGING_DOCTOR_ID: ${{ inputs.doctor_id }}
          CONFIRM_STAGING_TARGET: ${{ inputs.confirmation }}
          STAGING_FRONTEND_HOST: ${{ vars.STAGING_FRONTEND_HOST }}
          STAGING_API_HOST: ${{ vars.STAGING_API_HOST }}
        run: node scripts/staging-smoke-guard.mjs

      - name: Require staging-only test administrator secrets
        env:
          STAGING_ADMIN_EMAIL: ${{ secrets.STAGING_ADMIN_EMAIL }}
          STAGING_ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
        run: |
          test -n "$STAGING_ADMIN_EMAIL" || { echo "::error::Configure STAGING_ADMIN_EMAIL as a secret in the disposable-staging GitHub Actions environment."; exit 1; }
          test -n "$STAGING_ADMIN_PASSWORD" || { echo "::error::Configure STAGING_ADMIN_PASSWORD as a secret in the disposable-staging GitHub Actions environment."; exit 1; }

      - name: Setup pnpm
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          version: 11.21.0
          install: false

      - name: Install pinned repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit and target-guard tests
        run: pnpm test

      - name: Install isolated pinned Playwright runner
        run: npm install --prefix .e2e-tools --no-save --package-lock=false @playwright/test@1.64.1

      - name: Cache Playwright Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-1.64.1

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: ./.e2e-tools/node_modules/.bin/playwright install chromium

      - name: Probe deployed HTTPS, readiness and CORS before mutations
        env:
          FRONTEND_URL: ${{ inputs.frontend_url }}
          API_BASE_URL: ${{ inputs.api_base_url }}
        run: node scripts/deployment-preflight.mjs

      - name: Run deployed staging browser acceptance
        env:
          STAGING_FRONTEND_URL: ${{ inputs.frontend_url }}
          STAGING_API_BASE_URL: ${{ inputs.api_base_url }}
          STAGING_DOCTOR_ID: ${{ inputs.doctor_id }}
          STAGING_ADMIN_EMAIL: ${{ secrets.STAGING_ADMIN_EMAIL }}
          STAGING_ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
          CI: "true"
        run: ./.e2e-tools/node_modules/.bin/playwright test --config=e2e/staging-smoke.config.mjs

      - name: Upload staging smoke report only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: doctor-tracker-staging-smoke-report
          path: |
            staging-smoke-report/
            test-results-staging-smoke/
          if-no-files-found: warn
          retention-days: 7
