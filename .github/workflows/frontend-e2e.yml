name: Frontend browser E2E

on:
  pull_request:
    branches: [rakibul-hasan, dev, main, 'feat/**']
  push:
    branches: [rakibul-hasan, dev, main, 'feat/**']

permissions:
  contents: read

jobs:
  browser-e2e:
    name: Synthetic API browser journeys (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.21.0
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Install pinned isolated Playwright runner
        run: npm install --prefix .e2e-tools --no-save --package-lock=false @playwright/test@1.64.1
      - name: Cache Playwright browser binaries
        uses: actions/cache@v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-1.64.1
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: ./.e2e-tools/node_modules/.bin/playwright install chromium
      - name: Run synthetic browser journeys
        run: ./.e2e-tools/node_modules/.bin/playwright test --config=e2e/playwright.config.mjs
        env:
          CI: "true"
      - name: Upload browser reports and synthetic screenshots
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: doctor-tracker-browser-e2e
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
